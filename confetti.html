<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>락인 종료</title>
    <link rel="stylesheet" href="/src/confetti.css" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="card" class="card">
      <div class="card-lock">
        <svg viewBox="0 0 48 48" width="46" height="46" aria-hidden="true">
          <defs>
            <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#7cc4ff" />
              <stop offset="1" stop-color="#8b6dff" />

          </defs>
          <g class="cshackle"><path d="M16 21v-5.5a8 8 0 0 1 16 0V21" fill="none" stroke="url(#cg)" stroke-width="4.4" stroke-linecap="round" /></g>
          <rect x="9" y="20" width="30" height="22" rx="7" fill="rgba(255,255,255,0.85)" stroke="#fff" stroke-width="1.2" />
          <circle cx="24" cy="29.5" r="2.6" fill="#8b6dff" />
          <path d="M22.7 30.5h2.6l.8 5.2h-4.2z" fill="#8b6dff" />
        </svg>
      </div>
      <div>
        <h1 id="title">오전 코어타임이 끝났어요</h1>
        <p id="sub">이제 편하게 업무 보세요</p>
      </div>
    </div>
    <script type="module" src="/src/confetti.ts"></script>
  </body>
