<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>코어타이머</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="widget" class="widget">
      <div id="sparkles" class="sparkles"></div>

      <section id="main" class="main">
        <!-- 유리 자물쇠: 락인 중엔 잠기고, 끝나면 고리가 열린다 -->
        <button id="lock" class="lock no-drag" aria-label="자물쇠">
          <svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true">
            <defs>
              <linearGradient id="gShackle" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="var(--c1)" />
                <stop offset="1" stop-color="var(--c2)" />
              </linearGradient>
              <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
                <stop offset="1" stop-color="#ffffff" stop-opacity="0.55" />
              </linearGradient>
              <linearGradient id="gFill" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0" stop-color="var(--c2)" stop-opacity="0.85" />
                <stop offset="1" stop-color="var(--c1)" stop-opacity="0.55" />
              </linearGradient>
              <clipPath id="bodyClip"><rect x="9" y="20" width="30" height="22" rx="7" /></clipPath>
            </defs>
            <g class="shackle-wrap">
              <path class="shackle" d="M16 21v-5.5a8 8 0 0 1 16 0V21" />
            </g>
            <rect class="body" x="9" y="20" width="30" height="22" rx="7" />
            <!-- 진행률만큼 아래에서 차오르는 유리 속 액체 -->
            <g clip-path="url(#bodyClip)">
              <rect id="lockFill" class="lock-fill" x="9" y="42" width="30" height="22" />
            </g>
            <rect class="body-edge" x="9" y="20" width="30" height="22" rx="7" />
            <path class="gloss" d="M13 24.5q0-2 2-2h7" />
            <circle class="keyhole" cx="24" cy="29.5" r="2.6" />
            <path class="keyhole" d="M22.7 30.5h2.6l.8 5.2h-4.2z" />
          </svg>
        </button>

        <div class="info">
          <div class="row">
            <span id="label" class="label">코어타이머</span>
            <span class="row-end">
              <span id="pct" class="pct"></span>
              <button id="lockScreen" class="icon-btn no-drag" title="화면 잠금" aria-label="화면 잠금">
                <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true">
                  <rect x="2.5" y="3" width="15" height="10.5" rx="2" />
                  <path d="M7 17h6M10 13.5V17" />
                  <rect class="mini-lock" x="7.6" y="7.6" width="4.8" height="3.6" rx="0.9" />
                  <path class="mini-lock" d="M8.5 7.6V6.6a1.5 1.5 0 0 1 3 0v1" />
                </svg>
              </button>
            </span>
          </div>
          <div class="row time-row">
            <span id="clock" class="clock"></span>
            <span id="msg" class="msg"></span>
          </div>
          <div class="bar"><div id="fill" class="fill"></div></div>
          <div class="row sub">
            <button id="subLeft" class="sub-chip no-drag" type="button"></button>
            <span id="subRight" class="sub-right"></span>
          </div>
        </div>
      </section>

      <section id="dialog" class="dialog no-drag" hidden>
        <div class="d-head">
          <span id="dIcon" class="d-icon"></span>
          <div>
            <h3 id="dTitle"></h3>
            <p id="dText"></p>
          </div>
        </div>
        <div id="dButtons" class="buttons"></div>
      </section>

      <form id="settings" class="settings no-drag" hidden>
        <h2>설정 <small>한국 시간 · 평일</small></h2>
        <div class="clockin">
          <label>오늘 출근<input type="time" name="clockIn" /></label>
          <button type="button" id="clockInNow">지금</button>
          <span id="leaveHint" class="leave-hint"></span>
        </div>
        <span class="section-title">코어타임 <small>출근 시각과 상관없이 모두 같은 시간이에요</small></span>
        <div class="grid">
          <label>오전 시작<input type="time" name="amStart" required /></label>
          <label>오전 끝<input type="time" name="amEnd" required /></label>
          <label>오후 시작<input type="time" name="pmStart" required /></label>
          <label>오후 끝<input type="time" name="pmEnd" required /></label>
        </div>
        <label class="check"><input type="checkbox" name="hideOutside" /> 코어타임이 아닐 때는 숨기기</label>
        <label class="check"><input type="checkbox" name="autostart" /> 컴퓨터를 켜면 자동 실행</label>
        <p id="settingsError" class="error" hidden>시간 순서를 확인해 주세요 (오전 시작 &lt; 오전 끝 ≤ 오후 시작 &lt; 오후 끝)</p>
        <span class="preview-title">미리보기</span>
        <div class="preview-row">
          <button type="button" id="previewStart"><svg class="btn-ico" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="pi1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#8b6dff"/></linearGradient></defs><path d="M16 21v-5.5a8 8 0 0 1 16 0V21" fill="none" stroke="url(#pi1)" stroke-width="4.6" stroke-linecap="round"/><rect x="9" y="20" width="30" height="22" rx="7" fill="#fff" stroke="#fff"/><circle cx="24" cy="29.5" r="2.8" fill="#8b6dff"/><path d="M22.6 30.5h2.8l.8 5.4h-4.4z" fill="#8b6dff"/></svg>시작</button>
          <button type="button" id="previewCelebrate"><svg class="btn-ico" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="pi2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#8b6dff"/></linearGradient></defs><g transform="rotate(-16 32 21) translate(0 -5)"><path d="M16 21v-5.5a8 8 0 0 1 16 0V21" fill="none" stroke="url(#pi2)" stroke-width="4.6" stroke-linecap="round"/></g><rect x="9" y="20" width="30" height="22" rx="7" fill="#fff" stroke="#fff"/><circle cx="24" cy="29.5" r="2.8" fill="#8b6dff"/><path d="M22.6 30.5h2.8l.8 5.4h-4.4z" fill="#8b6dff"/><path d="M5 9l2 4M3 17h4M43 9l-2 4M45 17h-4" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round"/></svg>종료</button>
          <button type="button" id="previewLock"><svg class="btn-ico" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="pi3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#8b6dff"/></linearGradient></defs><rect x="5" y="8" width="38" height="26" rx="5" fill="#fff" stroke="url(#pi3)" stroke-width="3.6"/><path d="M17 42h14M24 34v8" stroke="url(#pi3)" stroke-width="3.6" stroke-linecap="round"/><rect x="18.5" y="19" width="11" height="9" rx="2.2" fill="#8b6dff"/><path d="M20.8 19v-2.2a3.2 3.2 0 0 1 6.4 0V19" fill="none" stroke="#8b6dff" stroke-width="2.4"/></svg>잠금 확인</button>
          <button type="button" id="simDay" title="07:50 → 19:00을 약 40초에 보여 드려요"><svg class="btn-ico" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="pi4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#8b6dff"/></linearGradient></defs><circle cx="24" cy="24" r="17" fill="#fff" stroke="url(#pi4)" stroke-width="3.6"/><path d="M17 17l9 7-9 7zM26 17l9 7-9 7z" fill="#8b6dff"/></svg>하루 빠르게</button>
        </div>
        <div class="buttons">
          <button type="button" id="resetDefaults">기본값</button>
          <span class="spacer"></span>
          <button type="button" id="cancelSettings">취소</button>
          <button type="submit" class="primary">저장</button>
        </div>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
